    preview {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + main.output + main.runtimeClasspath
    }
}

dependencies {
    api('com.falsepattern:endlessids-mc1.7.10:1.7.4:dev')
    api('ganymedes01.etfuturum:Et-Futurum-Requiem:2.6.58-GTNH:dev')
    api('com.github.GTNewHorizons:LootGames:2.2.14:dev')
    api('com.github.GTNewHorizons:Natura:2.8.24:dev')
    api('com.github.GTNewHorizons:twilightforest:2.7.40:dev')
    api(rfg.deobf('curse.maven:witchery-69673:2234410'))
    previewImplementation('tools.profiler:async-profiler:4.5')
}

abstract class DownloadProfilerArchive extends DefaultTask {

    @Input
    abstract Property<String> getSourceUrl()

    @OutputFile
    abstract RegularFileProperty getDestination()

    @TaskAction
    void download() {
        File output = destination.get().asFile
        output.parentFile.mkdirs()
        File temporary = new File(output.parentFile, output.name + '.part')
        try {
            new URL(sourceUrl.get()).withInputStream { input ->
                temporary.withOutputStream { stream -> stream << input }
            }
            java.nio.file.Files.move(
                temporary.toPath(),
                output.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally {
            temporary.delete()
        }
    }
}

