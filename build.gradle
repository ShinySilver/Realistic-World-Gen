def asyncProfilerVersion = '4.5'
def hostOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def hostArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def asyncProfilerPlatform = hostOs.contains('linux')
    ? (hostArch.contains('aarch64') || hostArch.contains('arm64') ? 'linux-arm64' : 'linux-x64')
    : hostOs.contains('mac') ? 'macos' : null
def asyncProfilerExtension = hostOs.contains('mac') ? 'zip' : 'tar.gz'
def asyncProfilerArchive = layout.buildDirectory.file(
    "downloads/async-profiler-${asyncProfilerVersion}-${asyncProfilerPlatform}.${asyncProfilerExtension}")
def asyncProfilerTools = layout.buildDirectory.dir('tools')
def asyncProfilerDirectory = layout.buildDirectory.dir(
    "tools/async-profiler-${asyncProfilerVersion}-${asyncProfilerPlatform}")

def downloadAsyncProfiler = tasks.register('debug_downloadAsyncProfiler', DownloadProfilerArchive) {
    group = 'verification'
    description = 'Downloads the async-profiler native distribution archive'
    if (asyncProfilerPlatform == null) {
        throw new GradleException('async-profiler provides official builds for Linux and macOS; use WSL on Windows.')
    }
    sourceUrl = "https://github.com/async-profiler/async-profiler/releases/download/v${asyncProfilerVersion}/async-profiler-${asyncProfilerVersion}-${asyncProfilerPlatform}.${asyncProfilerExtension}"
    destination = asyncProfilerArchive
}

def installAsyncProfiler = tasks.register('debug_installAsyncProfiler', Sync) {
    group = 'verification'
    description = 'Extracts the async-profiler native distribution used by debug_profilePreview'
    dependsOn downloadAsyncProfiler
    from(hostOs.contains('mac') ? zipTree(asyncProfilerArchive) : tarTree(resources.gzip(asyncProfilerArchive)))
    into(asyncProfilerTools)
}

tasks.register('debug_profilePreview', JavaExec) {
    group = 'verification'
    description = 'Profiles preview world generation and opens an async-profiler flame graph'
    dependsOn previewClasses, installAsyncProfiler
    classpath = sourceSets.preview.runtimeClasspath
    workingDir = project.projectDir
    mainClass = 'rwg.world.RWGPreviewTool'
    maxHeapSize = '1g'
    args '--instrument'

    def profileTimestamp = new java.text.SimpleDateFormat("dd.MM.yyyy_HH'h'mm").format(new Date())
    def flameGraph = layout.buildDirectory.file("profiles/rwg-preview_${profileTimestamp}.html")
    doFirst {
        def profile = flameGraph.get().asFile
        profile.parentFile.mkdirs()
        if (profile.exists() && !profile.delete()) {
            throw new GradleException("Could not replace old flame graph at ${profile}")
        }
        def libraryName = hostOs.contains('mac') ? 'libasyncProfiler.dylib' : 'libasyncProfiler.so'
        def library = new File(asyncProfilerDirectory.get().asFile, "lib/${libraryName}")
        if (!library.isFile()) throw new GradleException("async-profiler library not found at ${library}")
        systemProperty 'rwg.asyncProfilerOutput', profile.absolutePath
        jvmArgs "-agentpath:${library}=start,event=cpu,interval=1ms"
    }
    doLast {
        def profile = flameGraph.get().asFile
        if (!profile.isFile() || profile.length() == 0) {
            throw new GradleException("async-profiler did not create the flame graph at ${profile}")
        }
        println "async-profiler flame graph: ${profile}"
        try {
            if (java.awt.Desktop.isDesktopSupported()
                && java.awt.Desktop.getDesktop().isSupported(java.awt.Desktop.Action.BROWSE)) {
                java.awt.Desktop.getDesktop().browse(profile.toURI())
            } else {
                println 'Desktop browsing is unavailable; open the flame graph manually.'
            }
        } catch (Exception exception) {
            println 'Desktop browsing is unavailable; open the flame graph manually.'
        }
    }
}

