        'debug_verifyNoiseDeterminism',
        'debug_verifyBiomeRegistry',
        'debug_verifyCanyons',
        'debug_verifyHills',
        'debug_verifyTerrainProfiles',
        'debug_verifyColumnPlannerConcurrency',
        'debug_verifyCubicTerrainPipeline',
        'debug_verifyStructurePlanning')
