//version: 1707058017

plugins {
    id 'com.gtnewhorizons.gtnhconvention'
}

sourceSets {
    preview {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + main.output + main.runtimeClasspath
    }
}

dependencies {
    api('com.cardinalstar.cubicchunks:CubicChunks1710:v0.1.24-alpha:dev')
    api('com.falsepattern:endlessids-mc1.7.10:1.7.4:dev')
    api('ganymedes01.etfuturum:Et-Futurum-Requiem:2.6.58-GTNH:dev')
    api('com.github.GTNewHorizons:LootGames:2.2.14:dev')
    api('com.github.GTNewHorizons:Natura:2.8.24:dev')
    api('com.github.GTNewHorizons:twilightforest:2.7.40:dev')
    api(rfg.deobf('curse.maven:witchery-69673:2234410'))
    previewRuntimeOnly('it.unimi.dsi:fastutil:8.5.18')
}

tasks.register('runPreview', JavaExec) {
    group = 'verification'
    description = 'Opens the offline RWG_CONTINENT debug map'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.RWGPreviewTool'
    workingDir = project.projectDir
    maxHeapSize = '1g'
}

tasks.register('debug_probeBlendedChunk', JavaExec) {
    group = 'verification'
    description = 'Prints the active pipeline result for a chunk (-Pchunk=x,z)'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.RWGPreviewTool'
    workingDir = project.projectDir
    maxHeapSize = '1g'
    args "--probe-blended-chunk=${project.findProperty('chunk') ?: '0,0'}"
}

tasks.register('debug_probePoint', JavaExec) {
    group = 'verification'
    description = 'Prints the active pipeline result for a point (-Ppoint=x,z)'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.RWGPreviewTool'
    workingDir = project.projectDir
    maxHeapSize = '1g'
    args "--probe-point=${project.findProperty('point') ?: '0,0'}"
}

tasks.register('debug_verifyNoiseDeterminism', JavaExec) {
    group = 'verification'
    description = 'Temporary refactor guard for serial/parallel noise determinism and golden outputs'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.util.TemporaryNoiseVerification'
    workingDir = project.projectDir
    maxHeapSize = '1g'
}

tasks.register('debug_verifyBiomeRegistry', JavaExec) {
    group = 'verification'
