//version: 1707058017

plugins {
    id 'com.gtnewhorizons.gtnhconvention'
}

sourceSets {
    preview {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += output + main.output + main.runtimeClasspath
    }
}

def localDependencies = layout.projectDirectory.dir('dependencies')
def localCubicChunksRoot = localDependencies.dir('CubicChunks1710')
def localCubicChunksJar = localCubicChunksRoot.file('build/rwg/cubicchunks-dev.jar').asFile
def localAngelicaRoot = localDependencies.dir('Angelica')
def localAngelicaJar = localAngelicaRoot.file('build/rwg/angelica-dev.jar').asFile
def localCeleritasRoot = localDependencies.dir('Celeritas')
def localCeleritasJar = localCeleritasRoot.file('common/build/rwg/celeritas-common.jar').asFile

def registerLocalDependencyUpdate = { String taskName, String displayName, Directory dependencyRoot ->
    tasks.register(taskName, Exec) {
        group = 'build setup'
        description = "Fast-forwards the local ${displayName} checkout from its configured fork"
        workingDir = dependencyRoot.asFile
        commandLine 'git', 'pull', '--ff-only'
    }
}

def updateLocalCubicChunks = registerLocalDependencyUpdate(
    'updateLocalCubicChunks', 'CubicChunks', localCubicChunksRoot)
def updateLocalCeleritas = registerLocalDependencyUpdate(
    'updateLocalCeleritas', 'Celeritas', localCeleritasRoot)
def updateLocalAngelica = registerLocalDependencyUpdate(
    'updateLocalAngelica', 'Angelica', localAngelicaRoot)

dependencies {
    api(files(localCubicChunksJar))
    runtimeOnlyNonPublishable(files(localAngelicaJar))
    api('com.github.GTNewHorizons:RegionLib:v0.1.0-GTNH:dev')
    api('com.falsepattern:endlessids-mc1.7.10:1.7.4:dev')
    api('ganymedes01.etfuturum:Et-Futurum-Requiem:2.6.58-GTNH:dev')
    api('com.github.GTNewHorizons:LootGames:2.2.14:dev')
    api('com.github.GTNewHorizons:Natura:2.8.24:dev')
    api('com.github.GTNewHorizons:twilightforest:2.7.40:dev')
    api(rfg.deobf('curse.maven:witchery-69673:2234410'))
    previewRuntimeOnly('it.unimi.dsi:fastutil:8.5.18')
}

tasks.register('buildLocalCubicChunks', Exec) {
    group = 'build setup'
    description = 'Builds the CubicChunks submodule development jar used by this checkout'
    dependsOn updateLocalCubicChunks
    workingDir = localCubicChunksRoot.asFile
    commandLine './gradlew', 'syncRwgDevJar', '--quiet', '--no-daemon'
    environment 'GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath
}

tasks.register('buildLocalAngelica', Exec) {
    group = 'build setup'
    description = 'Builds the Angelica submodule development jar used by the client'
    dependsOn updateLocalAngelica, 'stageLocalCeleritas'
    workingDir = localAngelicaRoot.asFile
    commandLine './gradlew', 'downgradeJar', '--quiet', '--no-daemon', "-PlocalCeleritasJar=${localCeleritasJar.absolutePath}"
    environment 'GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath
}

tasks.register('stageLocalAngelica', Sync) {
    dependsOn 'buildLocalAngelica'
    from(localAngelicaRoot.dir('build/libs')) {
        include '*-dev.jar'
        rename { 'angelica-dev.jar' }
    }
    into localAngelicaRoot.dir('build/rwg')
}

tasks.register('buildLocalCeleritas', Exec) {
    group = 'build setup'
    description = 'Builds the Celeritas submodule common jar embedded by Angelica'
    // Nested Gradle builds share GRADLE_USER_HOME. Keep them sequential so two
    // Gradle versions cannot write the same artifact cache concurrently.
    dependsOn updateLocalCeleritas, 'buildLocalCubicChunks'
    workingDir = localCeleritasRoot.asFile
    commandLine './gradlew', ':common:jar', '--quiet', '--no-daemon'
    environment 'GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath
}

tasks.register('stageLocalCeleritas', Sync) {
    dependsOn 'buildLocalCeleritas'
    from(localCeleritasRoot.dir('common/build/libs')) {
        include 'common-*.jar'
        exclude '*-sources.jar'
        rename { 'celeritas-common.jar' }
    }
    into localCeleritasRoot.dir('common/build/rwg')
}

tasks.named('compileJava') {
    dependsOn tasks.named('buildLocalCubicChunks')
}

tasks.named('runClient') {
    dependsOn tasks.named('stageLocalAngelica')
}

