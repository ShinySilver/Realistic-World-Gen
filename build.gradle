    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.registry.BuiltinBiomeRegistrationVerification'
    workingDir = project.projectDir
}

tasks.register('debug_verifyCanyons', JavaExec) {
    group = 'verification'
    description = 'Verifies plateau-side river-canyon category resolution'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.CanyonMorphologyVerification'
    workingDir = project.projectDir
    maxHeapSize = '1g'
}

tasks.register('debug_verifyHills', JavaExec) {
    group = 'verification'
    description = 'Verifies the regional base-height threshold for hill categories'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.HillCategoryVerification'
    workingDir = project.projectDir
    maxHeapSize = '1g'
}

tasks.register('debug_verifyTerrainProfiles', JavaExec) {
    group = 'verification'
    description = 'Verifies shared hill/mountain detail and the coreward-steepening regional profile'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.terrain.RegionalTerrainProfileVerification'
    workingDir = project.projectDir
}

tasks.register('debug_verifyColumnPlannerConcurrency', JavaExec) {
    group = 'verification'
    description = 'Verifies parallel column planning determinism and in-progress request deduplication'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.ColumnPlannerConcurrencyVerification'
    workingDir = project.projectDir
    maxHeapSize = '1g'
}

tasks.register('debug_verifyCubicTerrainPipeline', JavaExec) {
    group = 'verification'
    description = 'Verifies cubic terrain classification, limits, and milestone-four material rules'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.CubicTerrainPipelineVerification'
    workingDir = project.projectDir
}

tasks.register('debug_verifyStructurePlanning', JavaExec) {
    group = 'verification'
    description = 'Verifies deterministic native cubic structure ownership and surface resolution'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.population.StructurePlanningVerification'
    workingDir = project.projectDir
}

tasks.register('debug_performanceScore', JavaExec) {
    group = 'verification'
    description = 'Reports deterministic preview-point and base-chunk throughput scores'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.WorldgenPerformanceScore'
    workingDir = project.projectDir
    maxHeapSize = '1g'
}

tasks.register('debug_calibrateOceanCoverage', JavaExec) {
    group = 'verification'
    description = 'Samples ocean coverage for the configured continent geometry and target fractions'
    dependsOn previewClasses
    classpath = sourceSets.preview.runtimeClasspath
    mainClass = 'rwg.world.OceanCoverageCalibration'
    workingDir = project.projectDir
    maxHeapSize = '1g'
    systemProperties System.properties.findAll { key, value -> key.toString().startsWith('rwg.') }
}

def worldgenProfileRoot = layout.buildDirectory.dir('worldgen-profiler')
def worldgenProfileServer = worldgenProfileRoot.map { it.dir('server') }
def worldgenProfileOutput = layout.buildDirectory.dir('profiles')

def cleanWorldgenProfileServer = tasks.register('cleanWorldgenProfileServer', Delete) {
    delete worldgenProfileServer
}

tasks.register('prepareWorldgenProfile') {
    group = 'verification'
    description = 'Creates the isolated deterministic server used by debug_profileWorldgen'
    dependsOn cleanWorldgenProfileServer
    outputs.dir(worldgenProfileServer)
    outputs.upToDateWhen { false }
    doLast {
        File serverDir = worldgenProfileServer.get().asFile
        File configDir = new File(serverDir, 'config')
        configDir.mkdirs()
        new File(serverDir, 'eula.txt').text = 'eula=true\n'
        new File(serverDir, 'server.properties').text = '''\
allow-flight=true
enable-query=false
enable-rcon=false
generator-settings=
level-name=rwg-profile
level-seed=927692613931855800
level-type=RWG2
max-tick-time=-1
online-mode=false
server-ip=127.0.0.1
server-port=0
spawn-animals=false
spawn-monsters=false
spawn-npcs=false
view-distance=2
'''
        new File(configDir, 'cubicchunks.cfg').text = '''\
general {
    I:spawnGenerateDistanceXZ=-1
    I:spawnGenerateDistanceY=-1
    I:spawnLoadDistanceXZ=-1
    I:spawnLoadDistanceY=-1
    I:defaultMinHeight=-1024
    I:defaultMaxHeight=2048
    S:dimensional_height_overrides <
        0:bottom:-1024
        0:top:2048
    >
}
'''
    }
}

if (project.hasProperty('rwgWorldgenProfileRun')) {
    tasks.named('runServer') {
        dependsOn tasks.named('prepareWorldgenProfile')
        workingDir = worldgenProfileServer.get().asFile
        jvmArgs(
            '-Drwg.profileWorldgen=true',
            '-Drwg.profileSeed=927692613931855800',
            "-Drwg.profileRadius=${project.findProperty('rwgProfileRadius') ?: '16'}",
            "-Drwg.profileMinCubeY=${project.findProperty('rwgProfileMinCubeY') ?: '-16'}",
            "-Drwg.profileMaxCubeY=${project.findProperty('rwgProfileMaxCubeY') ?: '31'}",
            "-Drwg.profileDir=${worldgenProfileOutput.get().asFile.absolutePath}")
    }
}

tasks.register('debug_profileWorldgen', Exec) {
    group = 'verification'
    description = 'Profiles a fresh 32x32 RWG2 CubicChunks region and writes HTML, JSON, and folded stacks'
    dependsOn tasks.named('prepareWorldgenProfile')
    workingDir = project.projectDir
    commandLine(
        './gradlew',
        'runServer',
        '-PrwgWorldgenProfileRun',
        "-PrwgProfileRadius=${project.findProperty('rwgProfileRadius') ?: '16'}",
        "-PrwgProfileMinCubeY=${project.findProperty('rwgProfileMinCubeY') ?: '-16'}",
        "-PrwgProfileMaxCubeY=${project.findProperty('rwgProfileMaxCubeY') ?: '31'}",
        '--no-daemon')
    environment 'GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath
    doLast {
        println "RWG worldgen profiles: ${worldgenProfileOutput.get().asFile}"
    }
}

tasks.register('debug_verifyWorldgen') {
    group = 'verification'
    description = 'Runs all deterministic RWG architecture and generation checks'
    dependsOn(
        'debug_verifyNoiseDeterminism',
        'debug_verifyBiomeRegistry',
        'debug_verifyCanyons',
        'debug_verifyHills',
        'debug_verifyTerrainProfiles',
        'debug_verifyColumnPlannerConcurrency',
        'debug_verifyCubicTerrainPipeline',
        'debug_verifyStructurePlanning')
}
