def worldgenProfileRoot = layout.buildDirectory.dir('worldgen-profiler')
def worldgenProfileServer = worldgenProfileRoot.map { it.dir('server') }
def worldgenProfileOutput = layout.buildDirectory.dir('profiles')

def cleanWorldgenProfileServer = tasks.register('cleanWorldgenProfileServer', Delete) {
    delete worldgenProfileServer
}

tasks.register('prepareWorldgenProfile') {
    group = 'verification'
    description = 'Creates the isolated deterministic server used by debug_profileWorldgen'
    dependsOn cleanWorldgenProfileServer
    outputs.dir(worldgenProfileServer)
    outputs.upToDateWhen { false }
    doLast {
        File serverDir = worldgenProfileServer.get().asFile
        File configDir = new File(serverDir, 'config')
        configDir.mkdirs()
        new File(serverDir, 'eula.txt').text = 'eula=true\n'
        new File(serverDir, 'server.properties').text = '''\
allow-flight=true
enable-query=false
enable-rcon=false
generator-settings=
level-name=rwg-profile
level-seed=927692613931855800
level-type=RWG2
max-tick-time=-1
online-mode=false
server-ip=127.0.0.1
server-port=0
spawn-animals=false
spawn-monsters=false
spawn-npcs=false
view-distance=2
'''
        new File(configDir, 'cubicchunks.cfg').text = '''\
general {
    I:spawnGenerateDistanceXZ=-1
    I:spawnGenerateDistanceY=-1
    I:spawnLoadDistanceXZ=-1
    I:spawnLoadDistanceY=-1
    I:defaultMinHeight=-1024
    I:defaultMaxHeight=2048
    S:dimensional_height_overrides <
        0:bottom:-1024
        0:top:2048
    >
}
'''
    }
}

if (project.hasProperty('rwgWorldgenProfileRun')) {
    tasks.named('runServer') {
        dependsOn tasks.named('prepareWorldgenProfile')
        workingDir = worldgenProfileServer.get().asFile
        jvmArgs(
            '-Drwg.profileWorldgen=true',
            '-Drwg.profileSeed=927692613931855800',
            "-Drwg.profileRadius=${project.findProperty('rwgProfileRadius') ?: '16'}",
            "-Drwg.profileVerticalRadius=${project.findProperty('rwgProfileVerticalRadius') ?: '16'}",
            "-Drwg.profileDir=${worldgenProfileOutput.get().asFile.absolutePath}")
        if (project.hasProperty('rwgProfileMinCubeY')) {
            jvmArgs "-Drwg.profileMinCubeY=${project.property('rwgProfileMinCubeY')}"
        }
        if (project.hasProperty('rwgProfileMaxCubeY')) {
            jvmArgs "-Drwg.profileMaxCubeY=${project.property('rwgProfileMaxCubeY')}"
        }
        if (project.hasProperty('rwgPlayerViewProfile')) {
            jvmArgs '-Drwg.profilePlayerView=true'
        }
    }
}

tasks.register('debug_profileWorldgen', Exec) {
    group = 'verification'
    description = 'Profiles a fresh client-sized RWG2 CubicChunks view and writes HTML, JSON, and folded stacks'
    dependsOn tasks.named('prepareWorldgenProfile')
    workingDir = project.projectDir
    commandLine(
        './gradlew',
        'runServer',
        '-PrwgWorldgenProfileRun',
        "-PrwgProfileRadius=${project.findProperty('rwgProfileRadius') ?: '16'}",
        "-PrwgProfileVerticalRadius=${project.findProperty('rwgProfileVerticalRadius') ?: '16'}",
        '--no-daemon')
    environment 'GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath
    File profileLog = worldgenProfileRoot.get().file('profile.log').asFile
    ignoreExitValue = true
    doFirst {
        profileLog.parentFile.mkdirs()
        ext.profileLogStream = new FileOutputStream(profileLog)
        standardOutput = ext.profileLogStream
        errorOutput = ext.profileLogStream
    }
    doLast {
        ext.profileLogStream.close()
        if (executionResult.get().exitValue != 0) {
            println profileLog.readLines().takeRight(80).join(System.lineSeparator())
            throw new GradleException("RWG worldgen profile failed; full log: ${profileLog}")
        }
        File newest = worldgenProfileOutput.get().asFile.listFiles()
            ?.findAll { it.name.endsWith('.json') }
            ?.max { it.lastModified() }
        println "RWG worldgen profile: ${newest ?: worldgenProfileOutput.get().asFile}"
        println "Full server log: ${profileLog}"
    }
}

tasks.register('debug_profilePlayerWorldgen', Exec) {
    group = 'verification'
    description = 'Profiles the exact CC player-view loading and culling path without a network client'
    dependsOn tasks.named('prepareWorldgenProfile')
    workingDir = project.projectDir
    commandLine(
        './gradlew',
        'runServer',
        '-PrwgWorldgenProfileRun',
        '-PrwgPlayerViewProfile',
        "-PrwgProfileRadius=${project.findProperty('rwgProfileRadius') ?: '16'}",
        "-PrwgProfileVerticalRadius=${project.findProperty('rwgProfileVerticalRadius') ?: '16'}",
        '--no-daemon')
    environment 'GRADLE_USER_HOME', gradle.gradleUserHomeDir.absolutePath
    File profileLog = worldgenProfileRoot.get().file('player-profile.log').asFile
    ignoreExitValue = true
    doFirst {
        profileLog.parentFile.mkdirs()
        ext.profileLogStream = new FileOutputStream(profileLog)
        standardOutput = ext.profileLogStream
        errorOutput = ext.profileLogStream
    }
    doLast {
        ext.profileLogStream.close()
        if (executionResult.get().exitValue != 0) {
            println profileLog.readLines().takeRight(80).join(System.lineSeparator())
            throw new GradleException("RWG player-view profile failed; full log: ${profileLog}")
        }
        File newest = worldgenProfileOutput.get().asFile.listFiles()
            ?.findAll { it.name.startsWith('rwg-player-view-') && it.name.endsWith('.json') }
            ?.max { it.lastModified() }
        println "RWG player-view profile: ${newest ?: worldgenProfileOutput.get().asFile}"
        println "Full server log: ${profileLog}"
    }
}

tasks.register('debug_verifyWorldgen') {
    group = 'verification'
